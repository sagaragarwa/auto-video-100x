name: ⚡ 5X Cloud Autonomous Video Engine (Zero Local Load)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Single Master Prompt (e.g. 5 minute dopamine detox in hindi)'
        required: true
        default: '5 minute dopamine detox documentary in Hindi, auto upload to psychology channel'
      duration:
        description: 'Target Duration in seconds (e.g. 300)'
        required: false
        default: '300'
      channel:
        description: 'Target Channel (channel_psychology, channel_trading, or auto)'
        required: false
        default: 'auto'
      auto_upload:
        description: 'Auto-upload to YouTube Studio'
        required: false
        default: 'false'
  repository_dispatch:
    types: [cloud_render, keepalive_ping]
  schedule:
    # Auto-run every 6 hours to ensure runner availability and zero inactivity
    - cron: '0 */6 * * *'

concurrency:
  group: cloud-master-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloud-render:
    name: 🚀 Cloud FFmpeg 1080p Render (Zero Local CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Devanagari Hindi Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk fonts-deva

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install loguru edge-tts requests pillow pydantic tomli

      - name: Execute 5X Master Video Generation in Cloud
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY || '48724139-1fbe7e777966fce52b390343f' }}
          PYTHONPATH: '.'
        run: |
          PROMPT="${{ github.event.inputs.prompt || '5 minute dopamine detox documentary in Hindi' }}"
          python -u yt_uploader/main.py master-engine --prompt "$PROMPT"

      - name: Upload 1080p Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: master_video_1080p
          path: output/*.mp4
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Thumbnail Artifact
        uses: actions/upload-artifact@v4
        with:
          name: master_thumbnail
          path: output/*_thumb.jpg
          if-no-files-found: warn
          retention-days: 14
